function syncAdScreen() {
  clearTimeout(adBreak.timer);
  const progress = adBreak.progress;
  if (!progress || progress.endsAt <= Date.now()) { closeAdScreen(); return; }
  if (!adBreak.dialog) {
    const seed = parseInt(progress.id.slice(-6), 16);
    // Chacun des deux pas parcourt les 24 affiches avant de revenir à la première.
    showAdScreen((seed + progress.turn * (seed % 2 ? 5 : 7)) % spoofAds.length);
  }
  adBreak.timer = setTimeout(syncAdScreen, Math.max(1, progress.endsAt - Date.now()));
}

function startAdBreak(session) {
  const key = "orbit-ad-break:" + S.uid;
  let pendingClick = 0;
  function beginAd(id, turn) {
    adBreak.progress = { id, turn, endsAt: Date.now() + AD_DURATION_MS };
    try { sessionStorage.setItem(key, JSON.stringify(adBreak.progress)); } catch { /* Onglet privé. */ }
    syncAdScreen();
  }
  function receive(event, known) {
    if (session !== gen) return;
    const previous = adBreak.event?.id;
    adBreak.event = event && typeof event.id === "string" && Number.isFinite(event.startedAt) ? event : null;
    adBreak.known = known;
    if (previous !== adBreak.event?.id) {
      clearTimeout(pendingClick);
      closeAdScreen();
      adBreak.progress = null;
      if (adBreak.event) {
        let saved;
        try { saved = JSON.parse(sessionStorage.getItem(key)); } catch { /* Premier affichage. */ }
        if (saved?.id === event.id && Number.isSafeInteger(saved.turn) && saved.turn >= 0 && Number.isFinite(saved.endsAt)) {
          adBreak.progress = saved;
          syncAdScreen();
        } else beginAd(event.id, 0);
      }
    }
    socialEvents.dispatchEvent(new Event("ad-break"));
  }
  function onAction(e) {
    const current = adBreak.progress;
    if (!e.isTrusted || !current || adBreak.dialog || Date.now() < current.endsAt + AD_PAUSE_MS) return;
    const target = e.target.closest?.("button, a[href], [role=button], .card, .pcard, .rank, .side-foot");
    if (!target || target.disabled || target.hasAttribute("data-ad-control")) return;
    // Laisser le clic ouvrir la fiche ou changer d’onglet avant de la recouvrir.
    clearTimeout(pendingClick);
    pendingClick = setTimeout(() => {
      if (session === gen && adBreak.progress === current && !adBreak.busy) beginAd(current.id, current.turn + 1);
    }, 0);
  }
  unsubs.push(onValue(socialPath("adBreak"), snap => receive(snap.val(), true), () => receive(null, false)));
  document.addEventListener("click", onAction, true);
  document.addEventListener("visibilitychange", syncAdScreen);
  unsubs.push(() => {
    clearTimeout(pendingClick);
    document.removeEventListener("click", onAction, true);
    document.removeEventListener("visibilitychange", syncAdScreen);
  });
}

let lgMode = "login";
function setLoginMode(mode) {
  lgMode = mode;
  const reg = mode === "register";
  $("lgTitle").textContent = reg ? "Créer un compte" : "Connexion";
  $("lgSub").textContent = reg ? "Choisis un pseudo (3 à 24 caractères : lettres, chiffres, _ ou -)\net un mot de passe d'au moins 6 caractères." : "Connecte-toi pour retrouver ta collection.";
  $("lgConfirmWrap").hidden = !reg;
  $("lgOk").textContent = reg ? "Créer mon compte" : "Se connecter";
  $("lgSwitch").textContent = reg ? "J'ai déjà un compte" : "Pas de compte ? Créer un compte";
  $("lgPass").setAttribute("autocomplete", reg ? "new-password" : "current-password");
  $("lgError").hidden = true;
}
function showLogin() { showScreen("login"); setLoginMode(lgMode); }
function authError(e) {
  const c = (e && e.code) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return "Pseudo ou mot de passe incorrect.";
  if (c.includes("email-already-in-use")) return "Ce pseudo est déjà pris.";
  if (c.includes("weak-password")) return "Mot de passe trop faible (6 caractères minimum).";
  if (c.includes("too-many-requests")) return "Trop d'essais. Attends quelques minutes.";
  if (c.includes("network-request-failed")) return "Pas de connexion internet.";
  return "Erreur : " + (c || (e && e.message) || e);
}
$("lgSwitch").addEventListener("click", () => setLoginMode(lgMode === "login" ? "register" : "login"));
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const showErr = (t) => { $("lgError").textContent = t; $("lgError").hidden = false; };
  const pseudo = $("lgPseudo").value.trim().toLowerCase(), pass = $("lgPass").value;
  if (!PSEUDO_RE.test(pseudo)) return showErr("Le pseudo doit faire 3 à 24 caractères : lettres, chiffres, _ ou -.");
  if (pass.length < 6) return showErr("Le mot de passe doit faire au moins 6 caractères.");
  if (lgMode === "register" && pass !== $("lgConfirm").value) return showErr("Les deux mots de passe ne sont pas identiques.");
  const btn = $("lgOk");
  btn.disabled = true;
  $("lgError").hidden = true;
  try {
    const email = `${pseudo}@${PSEUDO_DOMAIN}`;
    if (lgMode === "register") await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
    $("lgPass").value = "";
    $("lgConfirm").value = "";
  } catch (x) { showErr(authError(x)); }
  finally { btn.disabled = false; }
});

// Le suivi de la maintenance reste actif même quand la session applicative est suspendue.
let maintenanceOn = false, maintenanceKnown = false;
function startAccessWatch() {
  const cacheKey = "orbit_maintenance";
  maintenanceOn = localStorage.getItem(cacheKey) === "true";
  let user, moderatorUid = null, offRole, roleReady = false, checked = false, loginRequested = false;
  $("maintenance-logo").append(logoNode());
  function route() {
    if (user === undefined || !checked) return;
    $("lgSwitch").hidden = maintenanceOn;
    if (maintenanceOn && !(user && user.uid === moderatorUid)) {
      if (S.uid) endSession();
      if (loginRequested && !user) { setLoginMode("login"); showScreen("login"); }
      else {
        $("maintenance-login").disabled = !!user && !roleReady;
        $("maintenance-login").textContent = user ? "Changer de compte" : "Connexion admin";
        showScreen("maintenance");
      }
    } else if (user) {
      if (S.uid !== user.uid) startSession(user);
    } else {
      if (S.uid) endSession();
      if ($("login").hidden) showLogin();
    }
  }
  $("maintenance-login").onclick = async () => {
    loginRequested = true;
    if (user) {
      try { await signOut(auth); } catch (err) { loginRequested=false; toast(authError(err)); }
    } else route();
  };
  onValue(socialPath("maintenance"), snap => {
    maintenanceOn = snap.val() === true;
    maintenanceKnown = checked = true;
    localStorage.setItem(cacheKey,String(maintenanceOn));
    if (!maintenanceOn) loginRequested = false;
    route();
    socialEvents.dispatchEvent(new Event("maintenance"));
  }, () => {
    maintenanceKnown = false; checked = true; route();
    socialEvents.dispatchEvent(new Event("maintenance"));
  });
  // Hors ligne, conserver le dernier état connu pour la bibliothèque locale.
  function offline() { if (!checked && !navigator.onLine) { checked = true; route(); } }
  window.addEventListener("offline",offline);
  offline();
  onAuthStateChanged(auth, next => {
    if (offRole) offRole();
    user = next; moderatorUid = null; roleReady = !user;
    if (user) {
      loginRequested = false;
      const uid = user.uid;
      const role = value => {
        if (user?.uid !== uid) return;
        moderatorUid = value; roleReady = true; route();
      };
      offRole = onValue(socialPath("adminUid"),snap => role(snap.val()),() => role(null));
    }
    route();
  });
}
